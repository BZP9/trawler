[project]
name = "trawler"
version = "0.0.1"
description = "Row-by-row inference control plane for batch LLM gen + embedding pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "psycopg[binary,pool]>=3.1",
]

[project.optional-dependencies]
local = [
  "sentence-transformers>=2.2",
]

[project.scripts]
trawler = "trawler.cli:main"
trawler-init = "trawler.init:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trawler"]

[tool.hatch.build.targets.wheel.force-include]
"src/trawler/table/sql" = "trawler/table/sql"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

